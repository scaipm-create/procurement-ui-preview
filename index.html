<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="description" content="受密碼保護的展示頁面。">
<title>受保護的展示頁面</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
 font-family:Inter,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 background:#f7f8fa;color:#141718;font-size:16px;line-height:1.7}
:where(a,button,input):focus-visible{outline:3px solid #10402f;outline-offset:3px;box-shadow:0 0 0 3px #fff;border-radius:5px}
.card{width:min(460px,100%);background:#fff;border:1px solid #cdd8d2;border-radius:13px;padding:32px 30px}
.eyebrow{font-size:12px;letter-spacing:2px;color:#5d6c63;font-weight:600;margin:0 0 10px}
h1{font-size:23px;line-height:1.35;margin:0 0 10px;letter-spacing:-.3px}
.lead{font-size:14px;color:#4e5d54;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:600;color:#3d4a42;margin-bottom:7px}
input{width:100%;font:inherit;font-size:16px;padding:11px 13px;min-height:46px;
 border:1px solid #7e9299;border-radius:8px;background:#fff;color:#263037}
.hint{display:block;font-size:13px;color:#5d6c63;margin-top:7px}
button{width:100%;margin-top:20px;min-height:46px;font:inherit;font-size:16px;font-weight:600;
 border:1px solid #1c7f5e;background:#1c7f5e;color:#fff;border-radius:8px;cursor:pointer}
button:hover{background:#166b4e}
button[disabled]{opacity:.6;cursor:progress}
.msg{margin:16px 0 0;font-size:14px;padding:11px 13px;border-radius:8px;display:none}
.msg.show{display:block}
.msg.error{background:#fdf2f3;border:1px solid #d79aa0;color:#8d3f47}
.msg.busy{background:#eff5f8;border:1px solid #9db6c4;color:#45596a}
.note{margin:24px 0 0;padding-top:18px;border-top:1px solid #cdd8d2;font-size:13px;color:#5d6c63}
.note p{margin:0 0 6px}
.note p:last-child{margin:0}
@media(max-width:430px){.card{padding:24px 18px}h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media(forced-colors:active){.card,input{border:1px solid ButtonBorder}:focus-visible{outline:3px solid Highlight}}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow" lang="en">PROTECTED PREVIEW</p>
<h1>受保護的展示頁面</h1>
<p class="lead">本頁內容已加密。請輸入採購窗口提供的存取密碼。</p>

<form id="gate" autocomplete="on">
<label for="pw">存取密碼</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required
       aria-describedby="pw-hint" enterkeyhint="go">
<span class="hint" id="pw-hint">密碼由專案窗口另行提供，請勿轉寄本頁網址與密碼。</span>
<button type="submit" id="go">開啟展示</button>
</form>

<p class="msg" id="msg" role="alert" aria-live="assertive"></p>

<div class="note">
<p>展示資料均為合成資料，非實際營運資料。</p>
<p>本頁不會對外傳送任何輸入內容，解密全程在您的瀏覽器內完成。</p>
</div>
</main>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const msg=$('msg'),form=$('gate'),pw=$('pw'),go=$('go');
const cfg=JSON.parse($('payload').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function say(text,kind){msg.textContent=text;msg.className='msg show '+kind}
function clear(){msg.textContent='';msg.className='msg'}

if(!window.crypto||!crypto.subtle){
  say('此瀏覽器不支援本頁所需的解密功能，請改用 Chrome 或 Edge 最新版，並確認網址為 https。','error');
  pw.disabled=go.disabled=true;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const pass=pw.value;
  if(!pass)return;
  go.disabled=true;say('解密中，請稍候…','busy');
  try{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(cfg.salt),iterations:cfg.iterations,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(cfg.iv)},key,b64(cfg.ciphertext));
    const html=new TextDecoder().decode(plain);
    clear();
    document.open();document.write(html);document.close();
  }catch(err){
    go.disabled=false;
    say('密碼錯誤，無法解密。請確認與專案窗口提供的密碼一致（區分大小寫）。','error');
    pw.value='';pw.focus();
  }
});
})();
</script>
